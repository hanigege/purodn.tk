<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="220" fill="#4d6bfe" opacity="0.08"/>
  <circle cx="150" cy="540" r="260" fill="#7c3aed" opacity="0.07"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>

  <text x="600" y="190" text-anchor="middle" font-size="64" font-weight="700" fill="#f0f6ff">Claude Code × DeepSeek</text>
  <text x="600" y="262" text-anchor="middle" font-size="38" fill="#9db4d6">把终端 AI 助手切换到 deepseek-v4-flash</text>

  <g transform="translate(230, 330)">
    <rect width="180" height="64" rx="14" fill="url(#accent)"/>
    <text x="90" y="41" text-anchor="middle" font-size="24" font-weight="600" fill="#fff">Ubuntu</text>
  </g>
  <g transform="translate(510, 330)">
    <rect width="180" height="64" rx="14" fill="url(#accent)"/>
    <text x="90" y="41" text-anchor="middle" font-size="24" font-weight="600" fill="#fff">Debian</text>
  </g>
  <g transform="translate(790, 330)">
    <rect width="180" height="64" rx="14" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <text x="90" y="41" text-anchor="middle" font-size="24" font-weight="600" fill="#9db4d6">Alpine</text>
  </g>

  <text x="600" y="470" text-anchor="middle" font-size="26" fill="#6b83a8">ANTHROPIC_BASE_URL = api.deepseek.com/anthropic</text>
