<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Hugo 文章更新于时间机制备忘封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 网格背景 -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- 左上角徽标 -->
  <rect x="60" y="50" width="160" height="44" rx="22" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="140" y="79" font-family="monospace" font-size="20" fill="#22d3ee" text-anchor="middle">draft = true</text>

  <!-- 主标题 -->
  <text x="70" y="240" font-family="sans-serif" font-size="52" font-weight="bold" fill="#f8fafc">「更新于」时间机制</text>
  <text x="70" y="305" font-family="sans-serif" font-size="40" font-weight="600" fill="#94a3b8">与修改文章操作备忘</text>

  <!-- 装饰横线 -->
  <rect x="72" y="340" width="220" height="6" rx="3" fill="url(#accent)"/>

  <!-- 代码块示意 -->
  <rect x="70" y="380" width="700" height="180" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="100" y="420" font-family="monospace" font-size="22" fill="#e2e8f0">lastmod = ['lastmod', ':fileModTime']</text>
  <text x="100" y="458" font-family="monospace" font-size="22" fill="#64748b">↑ front matter 优先 · ↑ 文件修改时间兜底</text>
  <text x="100" y="500" font-family="monospace" font-size="20" fill="#38bdf8">改文章 → 保存 → 自动显示「更新于 今天」</text>
  <text x="100" y="538" font-family="monospace" font-size="20" fill="#fbbf24">有 lastmod 字段的文章 → 手动改当天</text>

  <!-- 右下角说明 -->
  <text x="1130" y="600" font-family="monospace" font-size="18" fill="#475569" text-anchor="end">内部备忘 · 永不发布 · 2026-08-06</text>
</svg>
