<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="purodn 命令部署手册封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 终端窗口 -->
  <rect x="80" y="60" width="600" height="380" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <circle cx="120" cy="92" r="8" fill="#f87171"/>
  <circle cx="150" cy="92" r="8" fill="#fbbf24"/>
  <circle cx="180" cy="92" r="8" fill="#34d399"/>
  <text x="110" y="130" font-family="monospace" font-size="24" fill="#e2e8f0">$ purodn</text>
  <text x="110" y="170" font-family="monospace" font-size="20" fill="#64748b">Pulling latest public/ ...</text>
  <text x="110" y="205" font-family="monospace" font-size="20" fill="#fbbf24">⚠️ draft leftover removed</text>
  <text x="110" y="240" font-family="monospace" font-size="20" fill="#38bdf8">Building Hugo site...</text>
  <text x="110" y="275" font-family="monospace" font-size="20" fill="#34d399">Published successfully.</text>
  <text x="110" y="325" font-family="monospace" font-size="24" fill="#e2e8f0">$ purodncode</text>
  <text x="110" y="360" font-family="monospace" font-size="20" fill="#64748b">Pulling latest source...</text>
  <text x="110" y="395" font-family="monospace" font-size="20" fill="#34d399">Source backup completed.</text>

  <!-- 右侧说明 -->
  <rect x="740" y="60" width="380" height="380" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="770" y="120" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f8fafc">两个命令</text>
  <text x="770" y="170" font-family="monospace" font-size="22" fill="#34d399">purodn</text>
  <text x="770" y="200" font-family="sans-serif" font-size="20" fill="#94a3b8">发布线上 · 清草稿残留</text>
  <text x="770" y="250" font-family="monospace" font-size="22" fill="#22d3ee">purodncode</text>
  <text x="770" y="280" font-family="sans-serif" font-size="20" fill="#94a3b8">备份源码 · 全量含草稿</text>
  <rect x="770" y="320" width="320" height="4" rx="2" fill="url(#accent)"/>
  <text x="770" y="370" font-family="sans-serif" font-size="20" fill="#e2e8f0">新机器部署：</text>
  <text x="770" y="405" font-family="monospace" font-size="18" fill="#fbbf24">装依赖 → 放脚本 → 配 .bashrc</text>

  <text x="1120" y="600" font-family="monospace" font-size="18" fill="#475569" text-anchor="end">内部运维手册 · 永不发布 · 2026-08-06</text>
</svg>
